# Текст-обусловленные зонды по ячейкам карты: existence / count / location / направленные счёты.
# Все признаки первого порядка по взаимодействию текст x картинка (см. docstring QueryHead).
_target_: src.models.fusion.QueryHead
dim: 256
num_queries: 6
hidden: 512
dropout: 0.1
relation_temp: 8.0
requires_spatial: true
feature_dropout: 0.0            # Dropout2d по каналам замороженной карты (против запоминания картинок)
sentence_in_readout: true       # false: MLP видит только признаки взаимодействия, не саму подпись
readout: mlp                    # mlp | cosine | bilinear_mlp
