# FiLM (Perez et al., 2018): текст генерирует gamma/beta для каждого резблока.
_target_: src.models.fusion.FiLMHead
num_blocks: 4
hidden_channels: 128
coord_channels: true            # CoordConv: x, y каналы перед каждым блоком
classifier_channels: 512
classifier_hidden: 1024
dropout: 0.1
requires_spatial: true
readout: cosine                 # cosine | bilinear_mlp | mlp (cosine: ограниченный логит, меньше запоминания)
readout_activation: relu        # relu | gelu; только MLP readout, не conv-блоки FiLM/CNN
input_pool: null                # [h, w]: усреднить входную карту до сетки h x w
feature_dropout: 0.0             # Dropout2d по каналам замороженной карты
