# Image tower of SigLIP2 ViT-B/16 (dual encoder, allowed by the rules); text tower is dropped.
# Position embedding is resampled to data.image_size: 256x384 -> 16x24 patch grid.
_target_: src.models.image_encoders.ClipImageEncoder
model_name: ViT-B-16-SigLIP2-256
pretrained: webli
image_size: ${data.image_size}
out_layer: -1                   # transformer block index; -1 = last
norm: true                      # apply the trunk's final LayerNorm to the tokens
spatial: true
freeze: true
cache_dir: null                 # null: HF cache; Kaggle: local path to the mounted weights
