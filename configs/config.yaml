# Корневой конфиг. Компонуется из групп ниже; любую можно переопределить из CLI:
#   python -m src.train model/fusion=mac model/image_encoder=convnext_tiny
#   python -m src.train experiment=film_rn
#   python -m src.train -m model/fusion=film,mac loss=bce,bce_pair     # multirun
defaults:
  - data: default
  - model/image_encoder: resnet50   # resnet101: веса недоступны офлайн на dev-машине
  - model/text_encoder: gru
  - model/fusion: film
  - loss: bce_pair
  - aug: default
  - train: default
  - tune: none
  - _self_
  - optional experiment: null   # пресет поверх всего остального

seed: 42
device: auto                    # auto: cuda -> mps -> cpu
name_exp: debug                 # 00X_<name> для основных прогонов
save_config: false              # true: сохранить конфиг в configs/archive/<name_exp>.yaml

paths:
  data_dir: data                # относительные пути: требование правил
  output_dir: artefacts/hydra/${name_exp}/${now:%Y-%m-%d_%H-%M-%S}
  features_dir: artefacts/features
  submissions_dir: submissions
  submission: final_submission.csv

hydra:
  job:
    chdir: false                # не менять cwd, иначе ломаются относительные пути
  run:
    dir: ${paths.output_dir}
  sweep:
    dir: artefacts/hydra/multirun/${name_exp}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

model:
  init_from: null               # name_exp прошлого прогона: скопировать совпадающие веса (warm start)
