# @package _global_
# Диагностический прогон: запоминание малой сбалансированной выборки (16 пар/категория = 144 пары, 288 строк).
# Наследует film_finetune (архитектура/LR те же), но train-only: регуляризация выключена
# ТОЛЬКО для проверки запоминания. Gate — post-fit метрики (train_fit AUC/accuracy/pair_accuracy
# и AUC каждой категории), не exit code; time-budget stop допускается.
defaults:
  - film_finetune
  - _self_

data:
  train_pairs_per_category: 16
train:
  eval:
    train: true
    holdout: false              # val не читается; monitor по train_fit
  epochs: 120                   # <= 1080 optimizer steps (9 batches/epoch)
  batch_size: 32
  optimizer:
    weight_decay: 0.0
  scheduler:
    name: constant
    warmup_epochs: 0
  early_stopping:
    monitor: train_fit_accuracy   # accuracy не зафиксирует слишком ранний checkpoint с AUC=1
    patience: 120
  time_budget_min: 20
  amp: false
model:
  text_encoder:
    dropout: 0.0
  fusion:
    dropout: 0.0
