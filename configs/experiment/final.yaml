# @package _global_
# Кандидат B: 007/014/015, holdout mean AUC 0.605125 (seeds 42/43/44, MPS).
# ceil(median(best_epoch=[20, 19, 19])) = 19. Kaggle cold proof ещё не выполнен.
defaults:
  - override /model/image_encoder: resnet50
  - override /model/text_encoder: gru
  - override /model/fusion: cosine
  - override /loss: bce
  - override /aug: none

seed: 42
name_exp: final_refit
data:
  train_on_val: true
  image_size: [160, 240]
  normalize: imagenet
  limit: null
model:
  init_from: null
  image_encoder:
    weights: IMAGENET1K_V2
    out_layer: layer3
    spatial: true
    freeze: true
    unfreeze_last_n_blocks: 0
  text_encoder:
    embed_dim: 200
    hidden_dim: 256
    num_layers: 1
    bidirectional: true
    dropout: 0.1
    lowercase: true
  fusion:
    proj_dim: 256
    init_scale: 10.0
    init_bias: 0.0
train:
  epochs: 19
  batch_size: 128
  pair_sampler: true
  optimizer:
    lr: 3.0e-4
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    warmup_epochs: 1
  amp: true
  grad_clip: 1.0
  time_budget_min: 45
  cache_features: true
  early_stopping: null
  predict_test: true
  postprocess:
    twin_normalize: true
paths:
  submission: final_submission.csv
