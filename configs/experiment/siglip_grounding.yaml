# @package _global_
# Frozen SigLIP2 patch tokens (cached) + GRU + GroundingHead (direct word-query -> cell attention).
defaults:
  - override /model/image_encoder: siglip2_b16
  - override /model/text_encoder: gru
  - override /model/fusion: grounding
  - override /loss: bce_pair
  - override /aug: default

data:
  normalize: siglip
  image_size: [256, 384]

train:
  epochs: 40
  batch_size: 128
  optimizer:
    lr: 3.0e-4
    weight_decay: 0.05
  scheduler:
    name: constant
    warmup_steps: 500
  early_stopping:
    monitor: val_auc
    patience: 8

model:
  fusion:
    input_pool: null            # full 16x24 grid: val AUC 0.923 vs 0.906 with 2x2 pooling
    max_cells: [16, 24]

aug:
  image:
    hflip_swap_lr: 0.0          # off until the flipped SigLIP cache is built and measured
  text:
    reorder_clauses_p: 0.3      # val_para AUC 0.703 -> 0.919, val AUC 0.923 -> 0.924
