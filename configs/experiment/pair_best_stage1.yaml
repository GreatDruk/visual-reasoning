# @package _global_
# Stage 1 of the current best (val AUC 0.9675 alone): pair-choice head on frozen SigLIP2
# block 8, full 16x24 grid, wide head, hflip with left/right swap. Train only -> val.
defaults:
  - pair_choice_siglip
  - override /aug: default

name_exp: debug_pair_best_stage1
model:
  image_encoder:
    out_layer: 8
  fusion:
    input_pool: null
    dim: 256
    queries: 8
    hidden: 256
train:
  time_budget_min: 40
