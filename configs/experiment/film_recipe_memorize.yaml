# @package _global_
# 288 fitted train rows; тот же training recipe, что film_finetune/018.
# Меняются только размер данных и train-only checkpoint selection; 30 epochs = 270 steps.
# Dropout, weight decay, LR, BN mode, cosine и warmup=1 наследуются без изменений.
defaults:
  - film_finetune
  - _self_

save_config: false
data:
  train_pairs_per_category: 16
train:
  time_budget_min: 10
  early_stopping:
    monitor: train_fit_accuracy
    patience: 30
  eval:
    train: true
    holdout: false
  diagnostics:
    enabled: true
    every_steps: 100
    probe_pairs_per_category: 2
    channel_stats: true
