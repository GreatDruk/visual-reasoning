# @package _global_
# Диагностика первого прохода по полному train; первый warmup epoch совпадает с 018.
# Для чистого сравнения: model.fusion.readout_activation=relu либо gelu.
# Probe содержит fitted train строки, не является holdout; val/test не читаются.
defaults:
  - film_finetune
  - _self_

save_config: false
train:
  epochs: 1
  early_stopping: null
  time_budget_min: 10
  eval:
    train: false
    holdout: false
  diagnostics:
    enabled: true
    every_steps: 100
    probe_pairs_per_category: 2
