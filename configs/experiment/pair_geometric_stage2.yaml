# @package _global_
# Train-only geometric refinement of a complete frozen stage-2 checkpoint.
defaults:
  - pair_best_stage2

name_exp: debug_pair_geometric_stage2
model:
  init_from: debug_count_on_F
  fusion:
    _target_: src.models.geometric_count.PairGeometricCountChoiceHead
    train_count_only: false
    geometry_dim: 64
    geometry_weight: 1.0
    baseline_weight: 1.0
    grounding_weight: 0.5
    behind_sign: -1
    geometry_sharpness: 12.0
    exclusion_radius: 0.12
train:
  time_budget_min: 14
