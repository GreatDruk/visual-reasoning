epochs: 20
max_steps: null                # стоп ровно после N optimizer updates (можно в середине эпохи); null — без лимита
snapshot_steps: []             # шаги optimizer updates для step_callback (плюс шаг 0 и финальный); дубликаты не вызываются
batch_size: 128
pair_sampler: true              # оба близнеца в одном батче (нужно для pair loss)
optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  image_encoder_lr: null
  slot_encoder_lr: null        # set e.g. 1e-5 for gentle supervised slot fine-tuning
  weight_decay: 1.0e-4
scheduler:
  name: cosine
  warmup_epochs: 1
  warmup_steps: null           # null: warmup_epochs; иначе абсолютное число optimizer steps
  total_steps: null            # горизонт cosine в optimizer steps; null — steps_per_epoch * epochs (как раньше)
  total_epochs: null           # горизонт в эпохах, если нужен более короткий повтор обучения
amp: true
grad_clip: 1.0
early_stopping:
  monitor: val_auc
  patience: 4
time_budget_min: 45             # лимит 50 мин на Kaggle GPU, оставляем запас на инференс
snapshot_reserve_sec: 0          # для max_steps: запас внутри бюджета на финальный snapshot
cache_features: true            # при замороженном энкодере считать фичи один раз
predict_test: false             # false: test не читается вообще; true: финальный запуск — предсказания после обучения
eval:
  train: false
  holdout: true
  metrics: [auc, accuracy, pair_accuracy, auc_per_category]
postprocess:
  twin_normalize: true          # p_a = sigmoid(s_a - s_b) внутри пар (картинка, категория)
diagnostics:
  enabled: false                # подробный train-only trace; не меняет optimizer/данные/модель
  every_steps: 100
  probe_pairs_per_category: 2    # фиксированный fitted-train probe; не holdout
  channel_stats: true            # p05/p50/p95, mean/std, negative/near-zero fractions по каналам
