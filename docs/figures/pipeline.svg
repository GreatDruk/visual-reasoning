<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 464" width="840" height="464" role="img" aria-labelledby="title description">
  <title id="title">Ансамбль 057: источники оценок и порядок их объединения</title>
  <desc id="description">Базовая смесь объединяет ConvNeXt-Tiny, сохранённые оценки SigLIP 2, две головы 045 на кандидатах от ResNet-50 и thaw и поправку rescue. Затем подключаются два счётчика 054 для counting и comparison, разность оценок ResNet-50 с TTA, поправка на перекрытие и условная перестановка по двум счётчикам 053 для counting. Сигмоида даёт вероятности в CSV.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="m1 1 5.5 3L1 7" fill="none" stroke="#637688" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="838" height="462" rx="16" fill="#f6f8fa" stroke="#d4dbe3" stroke-width="2"/>

  <g fill="none" stroke="#637688" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M394 93h49"/>
    <path d="M394 176h49"/>
    <path d="M394 237h49"/>
    <path d="M394 298h49"/>
    <path d="M394 359h49"/>
    <path d="M634 116v32"/>
    <path d="M634 200v9"/>
    <path d="M634 261v9"/>
    <path d="M634 322v9"/>
    <path d="M634 383v9"/>
  </g>

  <g stroke="#cad5df" fill="#fff">
    <rect x="20" y="48" width="374" height="90" rx="10"/>
    <rect x="20" y="152" width="374" height="48" rx="10"/>
    <rect x="20" y="213" width="374" height="48" rx="10"/>
    <rect x="20" y="274" width="374" height="48" rx="10"/>
    <rect x="20" y="335" width="374" height="48" rx="10"/>
  </g>

  <g stroke="#c9d7e4" fill="#edf3fa">
    <rect x="448" y="69" width="372" height="48" rx="10"/>
    <rect x="448" y="152" width="372" height="48" rx="10"/>
    <rect x="448" y="213" width="372" height="48" rx="10"/>
    <rect x="448" y="274" width="372" height="48" rx="10"/>
    <rect x="448" y="335" width="372" height="48" rx="10"/>
    <rect x="448" y="396" width="372" height="48" rx="10" fill="#eaf4ef" stroke="#c6ddd1"/>
  </g>

  <g fill="#21303b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="650">
    <text x="20" y="32">Источники оценок</text>
    <text x="448" y="32">Порядок объединения</text>
  </g>

  <g fill="#21303b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600">
    <text x="36" y="74">ConvNeXt-Tiny · SigLIP 2 из кэша</text>
    <text x="36" y="97">ResNet-50 + thaw → две головы 045</text>
    <text x="36" y="120">ResNet-50 + thaw → поправка rescue</text>
    <text x="36" y="173">Два счётчика 054 на ConvNeXt</text>
    <text x="36" y="234">ResNet-50 · четыре вида сцены</text>
    <text x="36" y="295">Донорские объекты и фон из train</text>
    <text x="36" y="356">Два счётчика 053 на ResNet-50</text>

    <text x="464" y="90">Базовая смесь логитов</text>
    <text x="464" y="173">Смесь с плотным подсчётом</text>
    <text x="464" y="234">Поправка TTA</text>
    <text x="464" y="295">Поправка на перекрытие</text>
    <text x="464" y="356">Условная перестановка в паре</text>
    <text x="464" y="417">Вероятности в CSV</text>
  </g>

  <g fill="#465b6d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
    <text x="36" y="190">Среднее двух оценок</text>
    <text x="36" y="251">Разница между средним и исходным видом</text>
    <text x="36" y="312">Вероятность почти скрытого объекта</text>
    <text x="36" y="373">Согласие двух оценок</text>

    <text x="464" y="107">Все категории</text>
    <text x="464" y="190">counting, comparison</text>
    <text x="464" y="251">Все категории</text>
    <text x="464" y="312">counting, comparison</text>
    <text x="464" y="373">Только неуверенные пары counting</text>
