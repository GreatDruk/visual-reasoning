[project]
name = "kaggle-visual-reasoning"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "hydra-core>=1.3.8",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "sweetviz>=2.3.3",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
