[project]
name = "visual-reasoning"
version = "0.2.0"
description = "Controlled scene perception experiments"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch>=2.5,<3", "torchvision>=0.20,<1", "transformers>=4.49,<6",
    "safetensors>=0.5,<1", "numpy>=1.26,<3", "pandas>=2.2,<4",
    "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "PyYAML>=6,<7", "Pillow>=10,<13", "filelock>=3.16,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
