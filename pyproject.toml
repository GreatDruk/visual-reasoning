[project]
name = "kaggle-visual-reasoning"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "hydra-core==1.4.0rc3",
    "hydra-optuna-sweeper==1.4.0rc3",
    "ipykernel>=7.4.0",
    "kaggle>=2.2.5",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "open-clip-torch>=4.2.2",
    "opencv-python-headless>=5.1.0.95",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.3",
    "six>=1.17.0",
    "sweetviz>=2.3.3",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
